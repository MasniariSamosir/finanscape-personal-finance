<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #a2d2ff, #cdb4db);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .reset-card {
      background: #fff;
      border-radius: 15px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
    }
    .reset-card h3 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .form-control {
      border-radius: 30px;
      padding: 0.75rem 1rem;
    }
    .btn-reset {
      background: linear-gradient(90deg, #1e3c72, #2a5298);
      border: none;
      border-radius: 30px;
      padding: 0.75rem;
      font-weight: 600;
      color: #fff;
      transition: 0.3s;
    }
    .btn-reset:hover {
      opacity: 0.9;
    }
    .extra-links {
      text-align: center;
      margin-top: 1rem;
    }
    .extra-links a {
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <h3>Reset Password</h3>
    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
      <div class="mb-3">
        <input type="password" class="form-control" name="new_password" placeholder="Password Baru" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="confirm_password" placeholder="Konfirmasi Password Baru" required>
      </div>
      <button type="submit" class="btn-reset w-100">Simpan Password Baru</button>
    </form>
    <div class="extra-links">
      <a href="{{ url_for('login') }}">Kembali ke Login</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
