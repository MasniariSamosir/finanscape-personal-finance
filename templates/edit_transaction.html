<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="mb-4 text-center">✏️ Edit Transaksi</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('edit_transaction', id=transaction.id) }}" method="POST">
        <div class="mb-3">
            <label class="form-label">Jenis Transaksi</label>
            <select name="type" class="form-select" required>
                <option value="Income" {% if transaction.type=='Income' %}selected{% endif %}>Pemasukan</option>
                <option value="Expense" {% if transaction.type=='Expense' %}selected{% endif %}>Pengeluaran</option>
                <option value="Tabungan" {% if transaction.type=='Tabungan' %}selected{% endif %}>Tabungan</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nominal (Rp)</label>
            <input type="number" step="0.01" name="amount" class="form-control" value="{{ transaction.amount }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Tanggal</label>
            <input type="date" name="date" class="form-control" value="{{ transaction.date }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Kategori</label>
            <select name="category_id" id="categorySelect" class="form-select" onchange="toggleCustomCategory()" required>
                {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if transaction.category_id==cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
                <option value="custom">+ Tambah Kategori Baru</option>
            </select>
            <!-- Input custom kategori -->
            <input type="text" name="custom_category" id="customCategoryInput" placeholder="Masukkan kategori baru" class="form-control mt-2" style="display:none;">
        </div>

        <button type="submit" class="btn btn-success">💾 Simpan Perubahan</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">❌ Batal</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleCustomCategory() {
    const select = document.getElementById("categorySelect");
    const input = document.getElementById("customCategoryInput");
    if (select.value === "custom") {
        input.style.display = "block";
        input.required = true;
    } else {
        input.style.display = "none";
        input.required = false;
    }
}
</script>
</body>
</html>
