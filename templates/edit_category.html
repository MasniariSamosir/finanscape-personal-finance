<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit Kategori</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <div class="card p-4">
      <h4>Edit Kategori</h4>
      <form method="POST" action="{{ url_for('edit_category', id=category.id) }}">
        <div class="mb-3">
          <label class="form-label">Nama Kategori</label>
          <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Jenis</label>
          <select name="type" class="form-control" required>
            <option value="Income" {% if category.type.lower() == 'income' %}selected{% endif %}>Pemasukan</option>
            <option value="Expense" {% if category.type.lower() == 'expense' %}selected{% endif %}>Pengeluaran</option>
            <option value="Tabungan" {% if category.type.lower() == 'tabungan' %}selected{% endif %}>Tabungan</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Simpan</button>
          <a href="{{ url_for('manage_categories') }}" class="btn btn-secondary">Batal</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
