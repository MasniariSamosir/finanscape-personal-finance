<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #a2d2ff, #cdb4db);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .forgot-card {
      background: #fff;
      border-radius: 15px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
    }
    .forgot-card h3 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .form-control {
      border-radius: 30px;
      padding: 0.75rem 1rem;
    }
    .btn-reset {
      background: linear-gradient(90deg, #1e3c72, #2a5298);
      border: none;
      border-radius: 30px;
      padding: 0.75rem;
      font-weight: 600;
      color: #fff;
      transition: 0.3s;
    }
    .btn-reset:hover {
      opacity: 0.9;
    }
    .extra-links {
      text-align: center;
      margin-top: 1rem;
    }
    .extra-links a {
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="forgot-card">
    <h3>Lupa Password</h3>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div>
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="mb-3">
        <input type="text" class="form-control" name="identifier" placeholder="Masukkan Email atau Username" required>
      </div>
      <button type="submit" class="btn-reset w-100">Kirim Link Reset</button>
    </form>
    <div class="extra-links">
      <a href="{{ url_for('login') }}">Kembali ke Login</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
